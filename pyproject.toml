[project]
name = "cloud.colosso"
version = "0.1.0"
description = "Un'app di esempio con OmniPort"  
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jinja2",
    "tomli; python_version < '3.11'",
    "cerberus",
]

[manager.defender]
key = "replace-this-development-key"
soglia_tentativi = 5
timeout_blocchi = 3600

[manager.presenter]
presentation = "demo.dsl"

[manager.messenger]
debug_mode = true
message = "default.dsl"

[manager.authenticator]
authentication = "default.dsl"

[manager.storekeeper]
persistence = "default.dsl"

