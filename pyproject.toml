[project]
name = "cloud.colosso"
version = "0.1.0"
description = "Un'app di esempio con OmniPort"  
readme = "README.md"
dependencies = [
    "jinja2",
    "tomli; python_version < '3.11'",
]

[manager.defender]
key = "replace-this-development-key"
soglia_tentativi = 5
timeout_blocchi = 3600

[manager.presenter]
presentation = "demo.dsl"

[manager.messenger]
debug_mode = true
message = "default.dsl"

[manager.authenticator]
authentication = "default.dsl"

[manager.storekeeper]
persistence = "default.dsl"

[[authentication.stub]]
name = "stub"

#[[message.console]]
#persistence = "log"
#name = "console"

[[message.bus]]
name = "broker"

#[[presentation.console]]
#name = "tui"

[[presentation.starlette]]
name = "web"
host = "127.0.0.1"
port = 8000
protocol = "http"
cors_origins = []
cors_credentials = false

[[persistence.filesystem]]
name = "log"

[[persistence.filesystem]]
name = "workfolder"

[[persistence.filesystem]]
name = "source"
path = "src/"
watch = true
message = "broker"